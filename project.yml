name: Guino

options:
  bundleIdPrefix: com.guino
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

targets:
  Guino:
    type: application
    platform: macOS
    sources:
      - Guino
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guino.app
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Guino/Info.plist
      properties:
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        CFBundleDisplayName: Guino
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSMicrophoneUsageDescription: "Guino usa el micrófono para avanzar el guion mientras hablas."
